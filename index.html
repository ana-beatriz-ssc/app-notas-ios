<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Notas</title>

  <!-- iOS: abrir em tela cheia quando adicionado à Tela de Início -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Notas">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <meta name="theme-color" content="#fbf0f4">

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="stylesheet" href="styles.css">
  <script src="themes.js"></script>
</head>
<body class="no-note">
  <div id="app">
    <!-- ================= Lista de notas ================= -->
    <aside id="list-pane" aria-label="Lista de notas">
      <header class="bar">
        <span class="bar-spacer"></span>
        <button id="btn-help" class="icon-btn accent" aria-label="Ajuda">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M9.4 9.3a2.7 2.7 0 0 1 5.2.9c0 1.8-2.6 2.3-2.6 3.9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><circle cx="12" cy="17.2" r="1.15"/></svg>
        </button>
        <button id="btn-menu" class="icon-btn accent" aria-label="Mais opções">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="7.5" cy="12" r="1.4"/><circle cx="12" cy="12" r="1.4"/><circle cx="16.5" cy="12" r="1.4"/></svg>
        </button>
      </header>
      <div class="list-scroll">
        <h1 id="list-title" class="large-title">Notas</h1>
        <label class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="2"/><path d="M15.5 15.5 21 21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="search" type="search" placeholder="Buscar" autocomplete="off" autocorrect="off" spellcheck="false" enterkeyhint="search">
        </label>
        <div id="folders" class="folders" role="tablist" aria-label="Pastas"></div>
        <div id="list"></div>
        <p id="list-empty" class="list-empty" hidden></p>
      </div>
      <footer class="bar bottom">
        <span class="bar-spacer"></span>
        <span id="count" class="count"></span>
        <button id="btn-new" class="icon-btn accent" aria-label="Nova nota">
          <svg viewBox="0 0 24 24"><path d="M14.5 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9.5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="m10 14 .6-2.9L18.3 3.4a1.4 1.4 0 0 1 2 0l.3.3a1.4 1.4 0 0 1 0 2l-7.7 7.7L10 14Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
      </footer>
    </aside>

    <!-- ================= Editor ================= -->
    <main id="editor-pane" aria-label="Editor">
      <header class="bar">
        <button id="btn-back" class="text-btn accent back" aria-label="Voltar para Notas">
          <svg viewBox="0 0 24 24"><path d="M15 4 7 12l8 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span>Notas</span>
        </button>
        <button id="btn-sidebar" class="icon-btn accent wide-only" aria-label="Esconder a lista (tela cheia)" aria-pressed="false">
          <svg viewBox="0 0 24 24"><rect x="3" y="4.5" width="18" height="15" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M9.5 4.5v15" stroke="currentColor" stroke-width="1.8"/><path d="M5.5 8.5h1.8M5.5 11.5h1.8" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <span class="bar-spacer"></span>
        <button id="btn-undo" class="icon-btn accent ink-only" aria-label="Desfazer" disabled>
          <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-redo" class="icon-btn accent ink-only" aria-label="Refazer" disabled>
          <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-paper" class="icon-btn accent note-only" aria-label="Folha e tamanho">
          <svg viewBox="0 0 24 24"><rect x="4.5" y="3" width="15" height="18" rx="2.5" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M8 8h8M8 12h8M8 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-folder" class="icon-btn accent note-only" aria-label="Mover para uma pasta">
          <svg viewBox="0 0 24 24"><path d="M3.5 7.5A2 2 0 0 1 5.5 5.5h4l2 2.2h7a2 2 0 0 1 2 2v7.8a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-pin" class="icon-btn accent note-only" aria-label="Fixar nota" aria-pressed="false">
          <svg viewBox="0 0 24 24"><path d="M9 3h6l-1 6 4 4v2H6v-2l4-4-1-6Z M12 15v6" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" stroke-linecap="round"/></svg>
        </button>
        <button id="btn-delete" class="icon-btn accent note-only" aria-label="Apagar nota">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M10 7V4.5h4V7M6.5 7l.9 12.2a1.5 1.5 0 0 0 1.5 1.3h6.2a1.5 1.5 0 0 0 1.5-1.3L17.5 7" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </button>
        <button id="btn-done" class="text-btn accent strong" hidden>OK</button>
      </header>

      <div class="editor-wrap">
        <!-- Nota digitada -->
        <div id="text-view" class="text-view">
          <p id="editor-date" class="editor-date"></p>
          <textarea id="editor" data-layout="lisa" placeholder="Comece a escrever…" spellcheck="true" autocapitalize="sentences"></textarea>
        </div>

        <!-- Nota manuscrita -->
        <div id="ink-view" class="ink-view">
          <div class="ink-head">
            <button id="ink-title" class="ink-title" aria-label="Renomear nota">Nota manuscrita</button>
            <span id="ink-info" class="ink-info"></span>
          </div>
          <div id="ink-host" class="ink-host"></div>

          <div id="ink-toolbar" class="ink-toolbar" role="toolbar" aria-label="Ferramentas">
            <button class="tool" data-tool="pen" aria-label="Caneta" aria-pressed="true">
              <svg viewBox="0 0 24 24"><path d="M4 20l1.2-4.6L16.6 4a2 2 0 0 1 2.8 0l.6.6a2 2 0 0 1 0 2.8L8.6 18.8 4 20Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m14.5 6 3.5 3.5" stroke="currentColor" stroke-width="1.8"/></svg>
            </button>
            <button class="tool" data-tool="hl" aria-label="Marca-texto" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="m9 16-2.5-2.5L15 5l4 4-8.5 8.5L9 16Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M6.5 13.5 4 19h5.5L9 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="M13 20.5h8" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" opacity=".45"/></svg>
            </button>
            <button class="tool" data-tool="eraser" aria-label="Borracha" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="m4.5 15.5 9.8-9.8a2 2 0 0 1 2.8 0l2.2 2.2a2 2 0 0 1 0 2.8L11 19H8l-3.5-3.5Z" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/><path d="m9 11 5 5M11 19h9" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
            </button>
            <span class="tb-sep"></span>
            <button id="tb-color" class="tb-btn" aria-label="Cor"><span class="swatch"></span></button>
            <button id="tb-size" class="tb-btn" aria-label="Espessura"><span class="size-dot"></span></button>
            <span class="tb-sep"></span>
            <button id="tb-finger" class="tb-btn" aria-label="Dedo escreve" aria-pressed="false">
              <svg viewBox="0 0 24 24"><path d="M8.5 12V5.8a1.5 1.5 0 0 1 3 0V11m0-1.5V4.3a1.5 1.5 0 0 1 3 0v6.2m0-.9V5.8a1.5 1.5 0 0 1 3 0V14c0 4-2.6 7-6.5 7-2.6 0-4.1-1.2-5.6-3.4L4 14.2a1.5 1.5 0 0 1 2.4-1.8l2.1 2.1" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <button id="tb-zoom" class="tb-btn zoom-label" aria-label="Zoom">100%</button>
          </div>
          <div id="ink-popover" class="popover" hidden></div>
        </div>

        <div class="editor-empty"><p>Nenhuma nota selecionada</p></div>
      </div>
    </main>
  </div>

  <!-- Folha de ações (menus e confirmações) -->
  <div id="sheet-backdrop" class="sheet-backdrop" hidden>
    <div class="sheet" role="dialog" aria-modal="true">
      <div id="sheet-group" class="sheet-group"></div>
      <button id="sheet-cancel" class="sheet-btn cancel">Cancelar</button>
    </div>
  </div>

  <!-- Painéis (ajuda, temas, folha, renomear) -->
  <div id="panel-backdrop" class="panel-backdrop" hidden>
    <section class="panel" role="dialog" aria-modal="true" aria-labelledby="panel-title">
      <header class="panel-head">
        <h2 id="panel-title"></h2>
        <button id="panel-close" class="text-btn accent strong">OK</button>
      </header>
      <div id="panel-body" class="panel-body"></div>
    </section>
  </div>

  <!-- Tutorial de boas-vindas -->
  <div id="onboarding" class="onboarding" hidden>
    <div class="ob-card" role="dialog" aria-modal="true" aria-label="Tutorial">
      <button id="ob-skip" class="text-btn accent ob-skip">Pular</button>
      <div id="ob-slides" class="ob-slides"></div>
      <div id="ob-dots" class="ob-dots"></div>
      <button id="ob-next" class="primary-btn">Próximo</button>
    </div>
  </div>

  <input id="import-file" type="file" accept="application/json,.json" hidden>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="ink.js"></script>
  <script src="help.js"></script>
  <script src="app.js"></script>
</body>
</html>
